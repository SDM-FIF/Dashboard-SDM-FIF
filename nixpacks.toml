[phases.setup]
nixPkgs = ['php82', 'php82Extensions.gd', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.zip', 'php82Extensions.bcmath', 'php82Extensions.curl', 'php82Extensions.fileinfo', 'php82Extensions.tokenizer', 'nodejs']

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --no-interaction',
  'npm ci'
]

[phases.build]
cmds = [
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache',
  'npm run build'
]

[start]
cmd = 'php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'